    <script>
      // Suppress benign Vite HMR WebSocket connection errors in iFrame preview (HMR is disabled in this environment)
      (function() {
        function isViteWsError(err) {
          if (!err) return false;
          var str = String(err.message || err.reason || err.filename || err.stack || err || '');
          return str.indexOf('WebSocket') !== -1 || 
                 str.indexOf('@vite/client') !== -1 || 
                 str.indexOf('ModuleRunnerTransport') !== -1 ||
                 str.indexOf('createWebSocketModuleRunnerTransport') !== -1;
        }

        window.addEventListener('error', function (e) {
          if (isViteWsError(e) || isViteWsError(e.error) || (e.filename && e.filename.indexOf('@vite/client') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function (e) {
          if (isViteWsError(e) || isViteWsError(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        // Safe WebSocket wrapper to swallow error events from Vite's HMR client
        if (typeof window !== 'undefined' && window.WebSocket) {
          var OrigWebSocket = window.WebSocket;
          window.WebSocket = function(url, protocols) {
            var ws;
            try {
              ws = new OrigWebSocket(url, protocols);
            } catch (err) {
              return {
                addEventListener: function() {},
                removeEventListener: function() {},
                send: function() {},
                close: function() {},
                readyState: 3
              };
            }
            ws.addEventListener('error', function(event) {
              if (event && event.stopImmediatePropagation) {
                event.stopImmediatePropagation();
              }
            });
            return ws;
          };
          window.WebSocket.prototype = OrigWebSocket.prototype;
          window.WebSocket.CONNECTING = OrigWebSocket.CONNECTING;
          window.WebSocket.OPEN = OrigWebSocket.OPEN;
          window.WebSocket.CLOSING = OrigWebSocket.CLOSING;
          window.WebSocket.CLOSED = OrigWebSocket.CLOSED;
        }
      })();
    </script>
